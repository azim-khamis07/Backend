[project]
name = "expense-tracker-backend"
version = "1.0.0"
description = "Production-ready expense tracker backend API with FastAPI, PostgreSQL, Redis, and Celery"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["fastapi", "expense-tracker", "postgresql", "redis", "celery", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]

dependencies = [
    # Web Framework
    "fastapi[all]==0.128.0",
    "uvicorn[standard]==0.40.0",
    "starlette==0.50.0",
    "python-multipart==0.0.21",
    
    # Database ORM & Migrations
    "sqlalchemy==2.0.45",
    "alembic==1.17.2",
    "psycopg2-binary==2.9.11",
    
    # Caching
    "redis==7.1.0",
    "hiredis==3.3.0",
    
    # Authentication & Security
    "python-jose[cryptography]==3.5.0",
    "passlib[bcrypt]==1.7.4",
    "python-dotenv==1.2.1",
    "cryptography==46.0.3",
    
    # AWS S3 Integration
    "boto3==1.42.24",
    "botocore==1.42.24",
    
    # Background Tasks
    "celery==5.6.2",
    "flower==2.0.1",
    "kombu==5.6.2",
    
    # PDF Generation
    "reportlab==4.4.7",
    "weasyprint==67.0",
    "Pillow==12.1.0",
    
    # Data Validation
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "email-validator==2.3.0",
    
    # Date/Time Utilities
    "python-dateutil==2.9.0.post0",
    "pytz==2025.2",
    
    # HTTP Client (for external APIs)
    "httpx==0.28.1",
    "aiohttp==3.13.3",
    
    # Logging & Monitoring
    "python-json-logger==4.0.0",
    "prometheus-client==0.23.1",
    
    # Rate Limiting
    "slowapi==0.1.9",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    "pytest-mock==3.15.1",
    "httpx==0.28.1",
    "faker==40.1.0",
    
    # Code Quality
    "black==25.12.0",
    "flake8==7.3.0",
    "isort==7.0.0",
    "mypy==1.19.1",
    "pylint==4.0.4",
    "bandit==1.9.2",
    
    # Type Stubs
    "types-python-dateutil==2.9.0.20251115",
    "types-redis==4.6.0.20241004",
    "types-passlib==1.7.7.20250602",
    
    # Pre-commit Hooks
    "pre-commit==4.5.1",
    
    # Documentation
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.1",
    
    # Load Testing
    "locust==2.43.0",
]

production = [
    # Production ASGI Server
    "gunicorn==21.2.0",
    
    # Performance Monitoring
    "sentry-sdk[fastapi]==2.48.0",
    
    # Additional Security
    "python-decouple==3.8",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = {find = {where = ["."], include = ["app*"], namespaces = false}}

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=html --cov-report=term-missing"

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.bandit]
exclude_dirs = ["tests", "migrations"]

